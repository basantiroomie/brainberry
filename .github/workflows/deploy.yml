name: Deploy and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type check
      run: npm run type-check
      
    - name: Lint
      run: npm run lint
      
    - name: Build
      run: npm run build
      
    - name: Test build output
      run: |
        echo "✅ Build completed successfully"
        ls -la .next/
        
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Trigger Vercel Deployment
      run: |
        echo "🚀 Deployment will be handled by Vercel's Git integration"
        echo "📅 Pushed at: $(date)"
        echo "📝 Commit: ${{ github.sha }}"
        
    - name: Wait for deployment
      run: |
        echo "⏳ Waiting for Vercel to deploy..."
        sleep 60
        
    - name: Test deployment
      run: |
        echo "🧪 Testing deployment..."
        
        # Test health endpoint with retries
        max_attempts=15
        attempt=1
        
        while [ $attempt -le $max_attempts ]; do
          echo "Testing attempt $attempt/$max_attempts"
          
          response=$(curl -s -w "%{http_code}" -o response.json "https://brainberry.vercel.app/api/health")
          http_code="${response: -3}"
          
          if [ "$http_code" = "200" ]; then
            echo "✅ Deployment is healthy!"
            cat response.json | jq . 2>/dev/null || cat response.json
            break
          else
            echo "⏳ Waiting for deployment to be ready... (status: $http_code)"
            sleep 15
            attempt=$((attempt + 1))
          fi
          
          if [ $attempt -gt $max_attempts ]; then
            echo "❌ Deployment test failed after $max_attempts attempts"
            echo "Last response:"
            cat response.json
            exit 1
          fi
        done
        
    - name: Warm up deployment
      run: |
        echo "🔥 Warming up new deployment..."
        
        # Warm up main pages
        pages=(
          "https://brainberry.vercel.app/"
          "https://brainberry.vercel.app/api/health"
          "https://brainberry.vercel.app/sitemap.xml"
        )
        
        for page in "${pages[@]}"; do
          echo "Warming: $page"
          curl -s "$page" > /dev/null
          sleep 2
        done
        
        echo "✅ Deployment warmed up successfully"
