name: Keep BrainBerry Alive

on:
  schedule:
    # Run every 5 minutes during active hours (6 AM - 11 PM UTC)
    - cron: '*/5 6-23 * * *'
    # Run every 30 minutes during low activity hours (11 PM - 6 AM UTC)
    - cron: '*/30 23,0-6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Ping Health Endpoint
      run: |
        echo "🚀 Pinging BrainBerry to keep it warm..."
        
        # Health check endpoint
        HEALTH_URL="https://brainberry.vercel.app/api/health"
        
        # Ping the health endpoint
        response=$(curl -s -w "%{http_code}" -o health_response.json "$HEALTH_URL")
        http_code="${response: -3}"
        
        echo "HTTP Status Code: $http_code"
        
        if [ "$http_code" = "200" ]; then
          echo "✅ BrainBerry is healthy!"
          cat health_response.json | jq .
        else
          echo "❌ Health check failed with status $http_code"
          cat health_response.json
          exit 1
        fi
        
    - name: Ping Main Pages
      run: |
        echo "🔍 Warming up main application pages..."
        
        # List of important pages to keep warm
        pages=(
          "https://brainberry.vercel.app/"
          "https://brainberry.vercel.app/child"
          "https://brainberry.vercel.app/educator"
          "https://brainberry.vercel.app/community"
        )
        
        for page in "${pages[@]}"; do
          echo "Pinging: $page"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$page")
          echo "Status: $status"
          
          if [ "$status" = "200" ] || [ "$status" = "307" ]; then
            echo "✅ $page is responsive"
          else
            echo "⚠️ $page returned status $status"
          fi
          
          # Small delay between requests
          sleep 2
        done
        
    - name: Test API Endpoints
      run: |
        echo "🧪 Testing critical API endpoints..."
        
        # Test sitemap
        echo "Testing sitemap..."
        sitemap_status=$(curl -s -o /dev/null -w "%{http_code}" "https://brainberry.vercel.app/sitemap.xml")
        echo "Sitemap status: $sitemap_status"
        
        # Test public API endpoints that don't require auth
        public_apis=(
          "https://brainberry.vercel.app/api/health"
          "https://brainberry.vercel.app/api/sitemap"
        )
        
        for api in "${public_apis[@]}"; do
          echo "Testing: $api"
          api_status=$(curl -s -o /dev/null -w "%{http_code}" "$api")
          echo "Status: $api_status"
          
          if [ "$api_status" = "200" ]; then
            echo "✅ $api is working"
          else
            echo "⚠️ $api returned status $api_status"
          fi
          
          sleep 1
        done
        
    - name: Log Activity
      run: |
        echo "📊 Keep-alive completed at $(date)"
        echo "🌍 GitHub Actions location: $(curl -s https://httpbin.org/ip | jq -r .origin)"
        echo "⏰ Next scheduled run: In 5-30 minutes (depending on time)"
        
    - name: Clean up
      run: |
        rm -f health_response.json
        echo "🧹 Cleanup completed"
