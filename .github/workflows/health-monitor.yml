name: BrainBerry Health Monitor

on:
  schedule:
    # Run health check every 15 minutes during peak hours
    - cron: '*/15 8-20 * * 1-5'  # Weekdays 8 AM - 8 PM UTC
    # Run every hour during off-peak hours
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  health-monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Comprehensive Health Check
      id: health
      run: |
        echo "🏥 Running comprehensive health check..."
        
        # Function to check endpoint
        check_endpoint() {
          local url=$1
          local name=$2
          local expected_status=${3:-200}
          
          echo "Checking $name: $url"
          
          response=$(curl -s -w "HTTPSTATUS:%{http_code};TIME:%{time_total}" "$url")
          http_code=$(echo "$response" | grep -o "HTTPSTATUS:[0-9]*" | cut -d: -f2)
          time_total=$(echo "$response" | grep -o "TIME:[0-9.]*" | cut -d: -f2)
          body=$(echo "$response" | sed -E 's/HTTPSTATUS:[0-9]*;TIME:[0-9.]*$//')
          
          echo "Status: $http_code | Time: ${time_total}s"
          
          if [ "$http_code" = "$expected_status" ]; then
            echo "✅ $name is healthy"
            return 0
          else
            echo "❌ $name failed - Expected: $expected_status, Got: $http_code"
            echo "Response: $body"
            return 1
          fi
        }
        
        # Track failures
        failures=0
        
        # Check main health endpoint
        if ! check_endpoint "https://brainberry.vercel.app/api/health" "Health API"; then
          failures=$((failures + 1))
        fi
        
        # Check main pages (some may redirect, so allow 200 or 3xx)
        if ! check_endpoint "https://brainberry.vercel.app/" "Home Page"; then
          # Try to get more info about the redirect
          redirect_status=$(curl -s -o /dev/null -w "%{http_code}" "https://brainberry.vercel.app/")
          if [[ "$redirect_status" =~ ^3[0-9][0-9]$ ]]; then
            echo "✅ Home Page redirecting properly ($redirect_status)"
          else
            failures=$((failures + 1))
          fi
        fi
        
        # Check sitemap
        if ! check_endpoint "https://brainberry.vercel.app/sitemap.xml" "Sitemap"; then
          failures=$((failures + 1))
        fi
        
        # Save failure count for next step
        echo "failures=$failures" >> $GITHUB_OUTPUT
        
        if [ $failures -eq 0 ]; then
          echo "🎉 All health checks passed!"
        else
          echo "⚠️ $failures health check(s) failed"
        fi
        
    - name: Performance Check
      run: |
        echo "⚡ Checking performance metrics..."
        
        # Test response time for health endpoint
        for i in {1..3}; do
          echo "Test $i:"
          curl -w "Time: %{time_total}s | Size: %{size_download} bytes | Speed: %{speed_download} bytes/s\n" \
               -s -o /dev/null "https://brainberry.vercel.app/api/health"
        done
        
    - name: Warm Up Critical Functions
      run: |
        echo "🔥 Warming up serverless functions..."
        
        # List of API endpoints to warm up (excluding auth-required ones)
        endpoints=(
          "/api/health"
          "/api/sitemap" 
        )
        
        for endpoint in "${endpoints[@]}"; do
          echo "Warming: $endpoint"
          curl -s "https://brainberry.vercel.app$endpoint" > /dev/null
          sleep 1
        done
        
        echo "✅ Serverless functions warmed up"
        
    - name: Database Connection Test
      run: |
        echo "🗄️ Testing database connectivity through health endpoint..."
        
        # The health endpoint should test basic app functionality
        response=$(curl -s "https://brainberry.vercel.app/api/health")
        
        if echo "$response" | grep -q '"status":"healthy"'; then
          echo "✅ Database connectivity appears healthy"
          echo "Response: $response"
        else
          echo "⚠️ Unexpected health response"
          echo "Response: $response"
        fi
        
    - name: Report Status
      run: |
        echo "📊 Health Monitor Summary"
        echo "=========================="
        echo "🕐 Check completed at: $(date)"
        echo "🌍 Runner location: $(curl -s https://httpbin.org/ip | jq -r .origin 2>/dev/null || echo 'unknown')"
        echo "🔄 Next check: Every 15 minutes (peak hours) or hourly (off-peak)"
        
        # If this was a failure, the job would have failed already
        echo "✅ Overall status: HEALTHY"
        
    # Optional: Create an issue if health checks fail repeatedly
    - name: Create Issue on Failure
      if: failure() && steps.health.outputs.failures != '0'
      uses: actions/github-script@v7
      with:
        script: |
          const title = `🚨 BrainBerry Health Check Failed - ${new Date().toISOString()}`;
          const body = `
          ## Health Check Failure Report
          
          **Time:** ${new Date().toISOString()}
          **Failures:** ${{ steps.health.outputs.failures }}
          **Runner:** ${{ runner.os }}
          
          ### What to check:
          1. Visit https://brainberry.vercel.app/api/health
          2. Check Vercel dashboard for any deployment issues
          3. Verify environment variables are set correctly
          4. Check Supabase connection status
          
          ### Actions taken:
          - Attempted to ping health endpoint
          - Tested main application pages
          - Verified sitemap accessibility
          
          This issue was automatically created by GitHub Actions.
          `;
          
          // Check if there's already an open issue
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['health-check-failure']
          });
          
          if (issues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['health-check-failure', 'automated']
            });
          }
